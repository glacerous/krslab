<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background-color: #f9f9f8;
    background-image: radial-gradient(#dcdcd7 1.4px, transparent 1.4px);
    background-size: 24px 24px;
    font-family: "Inter", -apple-system, sans-serif;
    color: #141413;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 76px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .date {
    font-family: "Space Mono", monospace;
    font-size: 20px; color: #6e6e77;
  }
  .center { display: flex; flex-direction: column; gap: 14px; }
  .numeral {
    font-family: "Gaegu", cursive;
    font-size: 168px; font-weight: 700; line-height: 0.88;
    color: #141413;
  }
  .caption {
    font-size: 40px; font-weight: 600; letter-spacing: -0.02em;
    color: #141413;
  }
  .sub {
    font-size: 24px; color: #6e6e77;
  }
  .dash {
    border-bottom: 3px dashed #f59e0b;
    padding-bottom: 2px;
  }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1.5px solid #e6e6e3; padding-top: 22px;
    font-family: "Gaegu", cursive; font-size: 28px; color: #5b82a6;
  }
</style>
</head>
<body>
  <div class="top">
    <svg width="168" height="60" viewBox="10 4 140 50" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="14" y="38" fill="#141413" font-family="Inter, sans-serif" font-weight="800" font-size="27" letter-spacing="-1.3">KRS</text>
      <text x="76" y="38" fill="#141413" font-family="Inter, sans-serif" font-weight="500" font-size="26" letter-spacing="-0.8">lab</text>
      <path d="M15 45.5C23 44.2 31 46.4 40 45.1C48 44 56 46 65 44.8" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4.5 3.5"/>
      <ellipse cx="96" cy="29" rx="26" ry="15" stroke="#5b82a6" stroke-width="2" transform="rotate(-4 96 29)"/>
    </svg>
    <span class="date" id="date">2026-01-21</span>
  </div>

  <div class="center">
    <div class="numeral" id="numeral">632</div>
    <div class="caption"><span class="dash" id="caption">visitors in 7 days</span></div>
    <div class="sub" id="sub">5,623 page views, 99% Indonesia</div>
  </div>

  <div class="footer">
    <span>krslab.vercel.app</span>
    <span>first week milestone</span>
  </div>
</body>
</html>
